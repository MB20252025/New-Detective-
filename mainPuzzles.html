<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Puzzles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            background: #0b1a2b;
            background-image: radial-gradient(circle at 20% 30%, #1a334a, #051020 90%);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #ece3d0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 0;
        }

        .scroll-host {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 24px 16px 32px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { max-width: 800px; width: 100%; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 2px solid rgba(182, 139, 92, 0.3);
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            font-weight: 600;
            color: #eace9f;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        .header .sub {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: #b8aa8a;
            margin-top: 6px;
            font-style: italic;
        }

        .header .badge {
            display: inline-block;
            margin-top: 10px;
            background: #1e3d4a;
            border: 1px solid #6b4f3c;
            border-radius: 60px;
            padding: 5px 18px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #cdba92;
        }

        .puzzle-wrapper { display: flex; flex-direction: column; gap: 20px; }

        .puzzle-card {
            position: relative;
            border-radius: 24px;
            padding: 26px 26px 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(182, 139, 92, 0.3);
            background-size: cover;
            background-position: center;
            background-color: #0f2030;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            min-height: 360px;
        }

        .puzzle-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 65%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 100%);
            z-index: 0;
            pointer-events: none;
        }

        .puzzle-card > * { position: relative; z-index: 1; }

        .puzzle-card:hover { border-color: #b68b5c; }

        .puzzle-card.solved {
            border-color: #4a8a6a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(74, 138, 106, 0.3) inset;
        }

        .puzzle-card.locked {
            border-color: #3a4a5a;
            filter: saturate(0.5);
        }

        .puzzle-number {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #eace9f;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(182, 139, 92, 0.3);
            border-radius: 40px;
            padding: 2px 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
            backdrop-filter: blur(2px);
        }

        .puzzle-title {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .puzzle-desc {
            font-size: 0.92rem;
            line-height: 1.55;
            color: #f5efdf;
            margin-bottom: 16px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 14px;
            border-left: 3px solid #b68b5c;
            backdrop-filter: blur(2px);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-top: 4px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #f5efdf;
            padding: 8px 16px 8px 10px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(182, 139, 92, 0.25);
            backdrop-filter: blur(2px);
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .option:hover {
            background: rgba(182, 139, 92, 0.25);
            border-color: rgba(182, 139, 92, 0.6);
        }

        .option:active { transform: scale(0.97); }

        .option.correct {
            background: rgba(74, 138, 106, 0.5);
            border-color: #4a8a6a;
        }

        .option.wrong {
            background: rgba(161, 61, 61, 0.5);
            border-color: #a13d3d;
        }

        .option:disabled { cursor: default; opacity: 0.7; }

        .option .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1e3d4a;
            color: #eace9f;
            font-weight: 700;
            font-size: 0.75rem;
            flex-shrink: 0;
            border: 1px solid rgba(182, 139, 92, 0.3);
        }

        .hint-area {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hint-btn {
            align-self: flex-start;
            background: rgba(15, 42, 63, 0.85);
            border: 1px solid #b68b5c;
            border-radius: 40px;
            padding: 6px 18px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: #ece3d0;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(2px);
        }

        .hint-btn:hover:not(:disabled) {
            background: #2a5a6a;
            border-color: #eace9f;
        }

        .hint-btn:active:not(:disabled) { transform: scale(0.96); }
        .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .hint-item {
            font-size: 0.85rem;
            color: #f5efdf;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 14px;
            border-left: 3px solid #b68b5c;
            backdrop-filter: blur(2px);
            line-height: 1.45;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        .feedback {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            line-height: 1.4;
            backdrop-filter: blur(2px);
        }
        .feedback.correct {
            background: rgba(74, 138, 106, 0.35);
            border: 1px solid #4a8a6a;
            color: #d7f5e4;
        }
        .feedback.wrong {
            background: rgba(161, 61, 61, 0.35);
            border: 1px solid #a13d3d;
            color: #ffd7d7;
        }

        .solved-banner {
            display: inline-block;
            background: rgba(74, 138, 106, 0.85);
            color: #fff;
            border-radius: 40px;
            padding: 6px 18px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            border: 1px solid #7bef7b;
        }

        .digit-reveal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #0b1e2b;
            border: 2px solid #f5c542;
            color: #f5c542;
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-top: 12px;
            box-shadow: 0 0 25px rgba(245, 197, 66, 0.4);
            text-shadow: 0 0 20px #f5c542;
        }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid rgba(182, 139, 92, 0.15);
            text-align: center;
            font-size: 0.75rem;
            color: #7a8f99;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.3px;
        }

        .footer span { color: #b68b5c; }

        @media (max-width: 640px) {
            .scroll-host { padding: 18px 12px 24px; }
            .header h1 { font-size: 1.35rem; }
            .puzzle-card { padding: 20px 18px 24px; min-height: 320px; }
            .puzzle-title { font-size: 1.05rem; }
            .puzzle-desc { font-size: 0.85rem; padding: 10px 12px; }
            .option { font-size: 0.82rem; padding: 6px 12px 6px 8px; }
            .option .letter { width: 22px; height: 22px; font-size: 0.7rem; }
            .options { gap: 8px 12px; }
            .hint-btn { font-size: 0.75rem; padding: 5px 14px; }
            .hint-item { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="scroll-host">
    <div class="container">
        <header class="header">
            <h1>⚓ WHITBY LIGHTHOUSE</h1>
            <div class="sub">— The 7 Main Puzzles —</div>
            <div class="badge" id="headerBadge">🧩 decode the digits · uncover the truth</div>
        </header>
        <div class="puzzle-wrapper" id="puzzleWrapper"></div>
        <div class="footer">
            <span>✦</span> &nbsp; each puzzle reveals one digit of the final cryptogram &nbsp; <span>✦</span>
        </div>
    </div>
</div>

<script>
(function(){
    'use strict';

    let STATE = null;
    let localFeedback = '';

    function send(msg){ try { window.parent.postMessage(msg, '*'); } catch(e){} }

    window.addEventListener('message', function(e){
        const d = e.data;
        if (!d || d.type !== 'INIT_STATE') return;
        STATE = d.data;

        // Handle feedback: 'wrong' auto-clears after 2s
        if (STATE.feedback === 'wrong') {
            localFeedback = 'wrong';
            render();
            setTimeout(function(){
                if (localFeedback === 'wrong') {
                    localFeedback = '';
                    render();
                }
            }, 2000);
        } else {
            localFeedback = STATE.feedback || '';
            render();
        }
    });

    send({ type: 'READY' });

    function imagePath(index){
        const ext = index === 0 ? 'jpg' : 'png';
        return 'p' + (index + 1) + '.' + ext;
    }

    function render(){
        const wrapper = document.getElementById('puzzleWrapper');
        const badge = document.getElementById('headerBadge');
        if (!wrapper) return;

        if (!STATE) {
            wrapper.innerHTML = '<div class="puzzle-card locked"><span class="lock-icon">⏳</span><div class="puzzle-title">Loading…</div></div>';
            return;
        }

        // ---- ALL SOLVED ----
        if (STATE.state === 'all_solved') {
            badge.textContent = '🏆 all 7 puzzles solved';
            wrapper.innerHTML =
                '<div class="puzzle-card solved" style="background-image:none;background:linear-gradient(145deg,#0f2a3f,#1a3a4a);">' +
                    '<span class="solved-banner">✓ COMPLETE</span>' +
                    '<div class="puzzle-title">All main puzzles solved!</div>' +
                    '<div class="puzzle-desc">The Cryptogram is now available in the Case File tab (after solving The Vault).</div>' +
                '</div>';
            return;
        }

        // ---- LOCKED (waiting for questions / bonus puzzle) ----
        if (STATE.state === 'locked') {
            badge.textContent = '🔒 next puzzle locked';
            wrapper.innerHTML =
                '<div class="puzzle-card locked" style="background-image:none;background:linear-gradient(145deg,#1a2a3a,#0f1f2f);">' +
                    '<span class="lock-icon">🔒</span>' +
                    '<div class="puzzle-title">' + (STATE.lockTitle || 'Next main puzzle locked') + '</div>' +
                    '<div class="puzzle-desc">' + (STATE.lockMessage || '') + '</div>' +
                '</div>';
            return;
        }

        // ---- ACTIVE PUZZLE ----
        const p = STATE.puzzle;
        const idx = STATE.currentIndex;
        const total = STATE.totalPuzzles;
        const solved = STATE.solved;
        const usedHints = STATE.hintsUsed || 0;
        const maxHints = STATE.maxHints || 3;
        const hints = STATE.hints || [];
        const hintsLeft = Math.max(0, maxHints - usedHints);

        badge.textContent = '🧩 puzzle ' + (idx + 1) + ' of ' + total;

        // Number label
        const numLabel = solved
            ? 'PUZZLE ' + (idx + 1) + '  ·  DIGIT ' + p.digit
            : 'PUZZLE ' + (idx + 1) + '  ·  DIGIT ???';

        // Options
        let optionsHtml = '';
        p.options.forEach(function(opt){
            const cls = solved ? 'option correct' : 'option';
            const dis = solved ? 'disabled' : '';
            optionsHtml +=
                '<div class="' + cls + '" data-letter="' + opt.letter + '" ' + dis + '>' +
                    '<span class="letter">' + opt.letter + '</span>' +
                    '<span class="text">' + opt.text + '</span>' +
                '</div>';
        });

        // Hints
        let hintsHtml = '';
        for (let i = 0; i < usedHints && i < hints.length; i++) {
            hintsHtml += '<div class="hint-item">💡 ' + hints[i] + '</div>';
        }

        // Hint button
        const hintBtnLabel = hintsLeft > 0
            ? '💡 Hint (' + hintsLeft + ' left, -2 Prison Years)'
            : '💡 No hints left';

        // Feedback
        let feedbackHtml = '';
        if (localFeedback === 'correct') {
            feedbackHtml = '<div class="feedback correct">✅ Correct! Digit revealed. Now solve the linked bonus puzzle to unlock the next interview round.</div>';
        } else if (localFeedback === 'wrong') {
            feedbackHtml = '<div class="feedback wrong">❌ Wrong answer. Try again.</div>';
        }

        // Solved overlay
        let solvedHtml = '';
        if (solved) {
            solvedHtml =
                '<div style="margin-top:14px;">' +
                    '<span class="solved-banner">✓ SOLVED</span>' +
                    '<div><span class="digit-reveal">' + p.digit + '</span></div>' +
                '</div>';
        }

        wrapper.innerHTML =
            '<div class="puzzle-card' + (solved ? ' solved' : '') + '" id="mainPuzzleCard" ' +
                'style="background-image:url(\'' + imagePath(idx) + '\');">' +
                '<div class="puzzle-number">' + numLabel + '</div>' +
                '<div class="puzzle-title">' + p.title + '</div>' +
                '<div class="puzzle-desc">' + p.desc + '</div>' +
                (solved ? '' : '<div class="options" id="optionsHost">' + optionsHtml + '</div>') +
                solvedHtml +
                (solved ? '' :
                    '<div class="hint-area">' +
                        (usedHints < maxHints
                            ? '<button class="hint-btn" id="hintBtn">' + hintBtnLabel + '</button>'
                            : '<button class="hint-btn" disabled>' + hintBtnLabel + '</button>') +
                        hintsHtml +
                    '</div>') +
                feedbackHtml +
            '</div>';

        // Wire up option clicks
        if (!solved) {
            document.querySelectorAll('#mainPuzzleCard .option').forEach(function(el){
                el.addEventListener('click', function(){
                    const letter = el.getAttribute('data-letter');
                    if (!letter) return;
                    send({ type: 'ANSWER', letter: letter });
                });
            });

            const hintBtn = document.getElementById('hintBtn');
            if (hintBtn) {
                hintBtn.addEventListener('click', function(){
                    send({ type: 'HINT' });
                });
            }
        }
    }
})();
</script>
</body>
</html>
