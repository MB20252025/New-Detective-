<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Puzzles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            background: #0b1a2b;
            background-image: radial-gradient(circle at 20% 30%, #1a334a, #051020 90%);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #ece3d0;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .scroll-host {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .puzzle-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        .puzzle-card {
            position: relative;
            border-radius: 24px;
            padding: 28px 28px 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(182, 139, 92, 0.3);
            background-size: cover;
            background-position: center;
            background-color: #0f2030;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }

        .puzzle-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 75%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 45%, transparent 100%);
            border-radius: 24px;
            z-index: 0;
            pointer-events: none;
        }

        .puzzle-card > * { position: relative; z-index: 1; }

        .puzzle-card:hover { border-color: #b68b5c; }

        .puzzle-card.solved {
            border-color: #4a8a6a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(74, 138, 106, 0.3) inset;
        }

        .puzzle-number {
            display: inline-block;
            align-self: flex-start;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #eace9f;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(182, 139, 92, 0.4);
            border-radius: 40px;
            padding: 3px 16px;
            margin-bottom: 14px;
            text-transform: uppercase;
            backdrop-filter: blur(2px);
        }

        .puzzle-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }
